# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Alfaiate TL content editor (docs/SPEC-sveltia-cms.md). Sveltia holds photos, journal posts, authors and site settings.
# Tailor and product text, prices, status and permissions stay in /admin (D1): the only link between the two is the slug.
#
# GitHub backend (docs/SPEC-sveltia-cms.md, phase C5). To edit the files on this computer without signing in: open /cms in Chrome, Edge or Brave and choose
# "Work with Local Repository", then pick the project folder. Saved changes are written into content/ and public/photos/ here; commit and push them as usual.
# Signing in with GitHub (for staff on other computers) needs the OAuth helper from phase C5. The branch is the one the content lives on; C5 moves it to staging-content.

backend:
  name: github
  repo: webbello/Alfaiate
  branch: handspark-theme

app_title: Alfaiate TL content
media_folder: public/photos
public_folder: /photos

media_libraries:
  default:
    config:
      max_file_size: 1572864
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048

output:
  omit_empty_optional_fields: true

i18n:
  structure: multiple_folders
  locales: [en, tet]
  default_locale: en

collections:
  - name: posts
    label: Posts
    label_singular: Post
    description: "Journal articles. Turn Draft off to publish. Tetun is optional: switch the Tetun tab off for a post that has none."
    icon: article
    folder: content/posts
    media_folder: /public/photos/posts
    public_folder: /photos/posts
    i18n: true
    slug: "{{slug}}"
    summary: "{{title}} · {{date | date('MMM D, YYYY')}}"
    thumbnail: cover
    sortable_fields:
      fields: [title, date, author]
      default:
        field: date
        direction: descending
    view_filters:
      filters:
        - name: published
          label: Published
          field: draft
          pattern: false
        - name: drafts
          label: Drafts
          field: draft
          pattern: true
    table_columns:
      - title
      - { field: "{{date | date('MMM D, YYYY')}}", label: Date }
      - author
      - tags
      - draft
    fields:
      - name: title
        label: Title
        i18n: true
      - name: date
        label: Published Date
        widget: datetime
        i18n: duplicate
      - name: draft
        label: Draft
        widget: boolean
        default: true
        hint: Only an approved article goes public. Leave on until the owner has read it.
        i18n: duplicate
      - name: author
        label: Author
        widget: relation
        collection: authors
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        required: false
        i18n: duplicate
      - name: tags
        label: Category
        widget: select
        options: [Tailoring tips, Care and repair]
        required: false
        i18n: duplicate
      - name: cover
        label: Cover Image
        widget: image
        required: false
        i18n: duplicate
      - name: cover_credit
        label: Photo credit
        hint: Shown under the cover picture. Fill it for a stock photo whose licence asks for credit.
        required: false
        i18n: duplicate
      - name: cover_alt
        label: Cover image description
        hint: One sentence for people who cannot see the picture, and the photo credit if the licence asks for one.
        required: false
        i18n: true
      - name: description
        label: Description
        widget: text
        hint: A short summary shown in the journal list and in search results.
        required: false
        i18n: true
      - name: body
        label: Body
        widget: richtext
        i18n: true

  - name: authors
    label: Authors
    label_singular: Author
    icon: group
    folder: content/authors
    extension: yml
    identifier_field: name
    summary: "{{name}} – {{role}}"
    thumbnail: avatar
    media_folder: /public/photos/authors
    public_folder: /photos/authors
    fields:
      - name: name
        label: Name
      - name: role
        label: Role
        required: false
      - name: avatar
        label: Avatar
        widget: image
        required: false
      - name: bio
        label: Bio
        widget: text
        required: false
      - name: links
        label: Links
        widget: list
        summary: "{{label}}"
        required: false
        fields:
          - name: label
            label: Label
          - name: url
            label: URL
            pattern: ["^https?://", Enter a URL starting with https://]

  - divider: true

  - name: tailor_photos
    label: Tailor photos
    label_singular: Tailor photo
    description: "One entry per tailor. The slug must match the one shown on the tailor's Photos tab in /admin. Only photos are changed here; text and publishing stay in /admin. The entry named example-tailor (or example-product) is used by the site's tests: leave it as it is."
    icon: photo_camera
    folder: content/photos/tailors
    extension: yml
    identifier_field: slug
    slug: "{{slug}}"
    summary: "{{slug}}"
    thumbnail: profile
    media_folder: /public/photos/tailors
    public_folder: /photos/tailors
    fields:
      - name: slug
        label: Tailor
        widget: relation
        collection: lists
        file: tailors
        value_field: "{{tailors.*.slug}}"
        display_fields: ["{{tailors.*.name}} ({{tailors.*.slug}})"]
        search_fields: ["{{tailors.*.name}}", "{{tailors.*.slug}}"]
        hint: A tailor missing here was added after the list was last updated (npm run cms:lists).
      - name: profile
        label: Profile photo
        widget: image
        required: false
      - name: profile_alt
        label: Profile photo description
        required: false
      - name: gallery
        label: Gallery
        widget: image
        multiple: true
        max: 6
        required: false
      - name: gallery_alt
        label: Gallery descriptions
        hint: One line per gallery picture, in the same order.
        widget: text
        required: false

  - name: product_photos
    label: Product photos
    label_singular: Product photo
    description: "One entry per product. The slug must match the one shown on the product's page in /admin. The entry named example-tailor (or example-product) is used by the site's tests: leave it as it is."
    icon: shopping_bag
    folder: content/photos/products
    extension: yml
    identifier_field: slug
    slug: "{{slug}}"
    summary: "{{slug}}"
    thumbnail: main
    media_folder: /public/photos/products
    public_folder: /photos/products
    fields:
      - name: slug
        label: Product
        widget: relation
        collection: lists
        file: products
        value_field: "{{products.*.slug}}"
        display_fields: ["{{products.*.name}} ({{products.*.slug}})"]
        search_fields: ["{{products.*.name}}", "{{products.*.slug}}"]
        hint: A product missing here was added after the list was last updated (npm run cms:lists).
      - name: main
        label: Main photo
        widget: image
        required: false
      - name: main_alt
        label: Main photo description
        required: false
      - name: gallery
        label: Gallery
        widget: image
        multiple: true
        max: 6
        required: false
      - name: gallery_alt
        label: Gallery descriptions
        hint: One line per gallery picture, in the same order.
        widget: text
        required: false

  - divider: true

  - name: lists
    label: Lists (read only)
    label_singular: List
    description: "Tailors and products from the database, for the dropdowns above. Written by npm run cms:lists: changes made here are replaced the next time it runs."
    icon: list
    files:
      - name: tailors
        label: Tailors
        file: content/lists/tailors.yml
        fields:
          - name: tailors
            label: Tailors
            widget: list
            summary: "{{name}} ({{slug}})"
            fields:
              - { name: slug, label: Slug }
              - { name: name, label: Name }
      - name: products
        label: Products
        file: content/lists/products.yml
        fields:
          - name: products
            label: Products
            widget: list
            summary: "{{name}} ({{slug}})"
            fields:
              - { name: slug, label: Slug }
              - { name: name, label: Name }

singletons:
  - name: site
    label: Site settings
    icon: settings
    file: content/settings/site.yml
    media_folder: /public/photos/site
    public_folder: /photos/site
    fields:
      - name: site_name
        label: Site name
        required: false
      - name: tagline
        label: Tagline
        hint: One short line under the site name. Empty keeps the site's own wording.
        required: false
      - name: contact_line
        label: Contact line
        hint: Shown in the footer. Empty keeps the site's own wording.
        required: false
      - name: social_links
        label: Social links
        widget: list
        summary: "{{label}}"
        required: false
        fields:
          - name: label
            label: Label
          - name: url
            label: URL
            pattern: ["^https?://", Enter a URL starting with https://]
      - name: share_image
        label: Default share image
        widget: image
        required: false
        hint: Shown when a page without its own picture is shared.
